<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Seguro | Portal de Apoio ao Estudante</title>
    <!-- Importação de Ícones Modernos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Paleta de Cores e Variáveis GLOBAIS */
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --secondary: #00cec9;
            --background: #f0f3f9;
            --text-color: #2d3436;
            --white: #ffffff;
            --accent: #ff7675;
            --accent-glow: rgba(255, 118, 117, 0.2);
            --shadow: 0 10px 30px rgba(108, 92, 231, 0.08);
            --gradient: linear-gradient(135deg, #6c5ce7, #00cec9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            background-image: 
                radial-gradient(at 0% 0%, rgba(162, 155, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 206, 201, 0.1) 0px, transparent 50%);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Cabeçalho Decorado e Imponente */
        header {
            background: var(--gradient);
            color: var(--white);
            padding: 70px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.2);
            position: relative;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        header p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            opacity: 0.95;
        }

        /* Container de Conteúdo */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 25px;
        }

        /* Menu de Abas Estilizado */
        .tabs-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--white);
            color: var(--text-color);
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-btn i {
            font-size: 1.1rem;
            color: var(--primary-light);
            transition: color 0.3s ease;
        }

        .tab-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(108, 92, 231, 0.15);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--gradient);
            color: var(--white);
        }

        .tab-btn.active i {
            color: var(--white);
        }

        /* Conteúdo das Abas */
        .tab-content {
            display: none;
            animation: slideUp 0.4s ease forwards;
        }

        .tab-content.active {
            display: block;
        }

        /* Cartões de Seção Ultra Decorados */
        .section-card {
            background-color: var(--white);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(108, 92, 231, 0.05);
        }

        /* Estilo dos Títulos com Ícones */
        h2 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 700;
        }

        h2 i {
            background: rgba(108, 92, 231, 0.1);
            padding: 12px;
            border-radius: 16px;
            font-size: 1.5rem;
            color: var(--primary);
        }

        h3 {
            color: var(--primary);
            margin: 25px 0 15px 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        p {
            font-size: 1.1rem;
            color: #4a4a4a;
            margin-bottom: 20px;
        }

        /* Listas de Informação Detalhada (Aba 1) */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-item {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border-left: 4px solid var(--secondary);
        }

        .info-item strong {
            display: block;
            color: var(--text-color);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        /* Área de Teste/Sinais Interativa (Aba 2) */
        .checklist-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .checklist-item:hover {
            border-color: var(--primary-light);
            background-color: rgba(162, 155, 254, 0.05);
        }

        .checklist-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: var(--white);
        }

        .checklist-item input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checklist-item input[type="checkbox"]:checked::after {
            content: '✔';
            color: var(--white);
            font-size: 14px;
            font-weight: bold;
        }

        .checklist-item span {
            font-size: 1.05rem;
            font-weight: 500;
            color: #334155;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffeaa7, #fffae6);
            border-left: 6px solid #fdcb6e;
            color: #d63031;
            display: none;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(253, 203, 110, 0.2);
        }

        /* Caixinha de Suporte Premium (Aba 3) */
        .support-box {
            border-top: 6px solid var(--accent);
        }

        .support-box h2 i {
            background: rgba(255, 118, 117, 0.1);
            color: var(--accent);
        }

        .step-list {
            list-style: none;
            counter-reset: custom-counter;
        }

        .step-list li {
            position: relative;
            margin-bottom: 25px;
            padding-left: 60px;
            font-size: 1.05rem;
        }

        .step-list li::before {
            counter-increment: custom-counter;
            content: counter(custom-counter);
            position: absolute;
            left: 0;
            top: 2px;
            background: linear-gradient(135deg, var(--accent), #ff7675);
            color: var(--white);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        /* Canais de Ajuda */
        .help-channels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 35px;
        }

        .channel-card {
            background-color: #fdfdfd;
            border: 2px dashed rgba(108, 92, 231, 0.2);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .channel-card:hover {
            border-color: var(--secondary);
            box-shadow: 0 8px 20px rgba(0, 206, 201, 0.1);
        }

        .channel-card strong {
            color: var(--primary);
            font-size: 1.2rem;
            display: block;
            margin-bottom: 10px;
        }

        .btn-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 24px;
            background: var(--gradient);
            color: var(--white);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 1rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            margin-top: 60px;
        }

        /* Animações */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
